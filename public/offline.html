<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chai Ki Tapri — Offline</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 10px; padding: 24px; text-align: center;
        color: #fff8eb; background: #101c28;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      h1 { font-size: 22px; font-weight: 400; margin: 0; }
      p { margin: 0; color: rgba(255, 248, 235, 0.6); font-size: 14px; max-width: 32ch; }
      button {
        margin-top: 10px; padding: 10px 18px; border: 0; border-radius: 30px;
        color: #251b14; background: #f2c584; font-weight: 600; font-size: 13px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>चाय की टपरी is offline</h1>
    <p>No connection right now — the tapri will be back as soon as you're online again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </body>
</html>
